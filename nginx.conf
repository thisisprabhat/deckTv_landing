server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health Check Endpoint
    location = /health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files /health @fallback_health;
    }

    location @fallback_health {
        return 200 '{"status":"ok","service":"decktv-landing"}';
    }

    # Static Assets with Immutable Cache (hashed)
    location ~* \.(?:css|js|woff2|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Critical brand icons and favicons: revalidate immediately so updates are instantaneous
    location ~* ^/(?:icons/|favicon) {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Brand images, badges and screenshots (revalidate to prevent stale image caches)
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Clean URLs and HTML routing
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
